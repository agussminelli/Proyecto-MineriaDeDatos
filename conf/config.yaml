dataset:
  module: all # all, Neonate, Child, Adult

representation: hybrid  # dense, lsa, hybrid
text_column: open_response_clean

preprocess:
  download: false

embedding:
  model_name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  local_files_only: true
  recalculate: false

tfidf:
  n_min: 1
  n_max: 2
  min_docs: 5
  max_feat: 1000

lsa:
  n_components: 50

pca:
  enabled: true
  variance_threshold: 0.95

hybrid:
  alpha: 0.5  # TF-IDF/LSA weight

clustering:
  metric: euclidean
  p: 2
  eps_values: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0]
  min_samples_values: [3, 5, 9, 12, 20]

selection:
  min_coverage: 0.70

seed: 42

hydra:
  job:
    chdir: false
  run:
    dir: outputs/experiments/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}
  sweep:
    dir: outputs/experiments/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}
    subdir: ${hydra.job.num}